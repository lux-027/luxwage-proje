<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>LuxWage Logo</title></head>
<body style="margin:0;background:#060d1f;display:flex;flex-direction:column;align-items:center;padding:48px 20px;gap:40px;font-family:'Segoe UI',Arial,sans-serif">
<h2 style="color:white;font-size:22px;margin:0;letter-spacing:1px">LuxWage — Logo Seçenekleri</h2>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px;max-width:820px">

  <!-- 1: Koyu zemin, ince akışkan W, emerald→mavi gradient çizgi, küçük nokta süsler -->
  <div onclick="pick('1')" id="v1" style="display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;padding:20px;border-radius:20px;border:2px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);transition:all .25s">
    <svg width="130" height="130" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="a1bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d1b3e"/><stop offset="100%" stop-color="#1a2f6e"/></linearGradient>
        <linearGradient id="a1w" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
      </defs>
      <rect width="100" height="100" rx="24" fill="url(#a1bg)"/>
      <!-- Akışkan W — bezier eğrileri -->
      <path d="M13,28 C15,28 19,30 21,36 L28,62 C29,67 31,67 33,62 L40,38 C42,32 44,30 50,30 C56,30 58,32 60,38 L67,62 C69,67 71,67 72,62 L79,36 C81,30 85,28 87,28"
            fill="none" stroke="url(#a1w)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Küçük dekor nokta -->
      <circle cx="50" cy="76" r="3" fill="#34d399" fill-opacity="0.6"/>
    </svg>
    <div style="text-align:center">
      <div style="color:white;font-size:13px;font-weight:600">Akışkan Gradient</div>
      <div style="color:#64748b;font-size:11px;margin-top:2px">Emerald → Mavi</div>
    </div>
  </div>

  <!-- 2: Beyaz kart, gölgeli, siyah W — minimal premium -->
  <div onclick="pick('2')" id="v2" style="display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;padding:20px;border-radius:20px;border:2px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);transition:all .25s">
    <svg width="130" height="130" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="24" fill="#f8fafc"/>
      <path d="M13,28 C15,28 19,30 21,36 L28,62 C29,67 31,67 33,62 L40,38 C42,32 44,30 50,30 C56,30 58,32 60,38 L67,62 C69,67 71,67 72,62 L79,36 C81,30 85,28 87,28"
            fill="none" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Emerald alt aksan -->
      <rect x="38" y="78" width="24" height="3.5" rx="1.75" fill="#34d399"/>
    </svg>
    <div style="text-align:center">
      <div style="color:white;font-size:13px;font-weight:600">Beyaz Minimal</div>
      <div style="color:#64748b;font-size:11px;margin-top:2px">Siyah W + Yeşil Aksan</div>
    </div>
  </div>

  <!-- 3: Koyu zemin, beyaz W, sağ üstte küçük emerald nokta -->
  <div onclick="pick('3')" id="v3" style="display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;padding:20px;border-radius:20px;border:2px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);transition:all .25s">
    <svg width="130" height="130" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="a3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient></defs>
      <rect width="100" height="100" rx="24" fill="url(#a3)"/>
      <path d="M13,28 C15,28 19,30 21,36 L28,62 C29,67 31,67 33,62 L40,38 C42,32 44,30 50,30 C56,30 58,32 60,38 L67,62 C69,67 71,67 72,62 L79,36 C81,30 85,28 87,28"
            fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="80" cy="22" r="6" fill="#34d399"/>
    </svg>
    <div style="text-align:center">
      <div style="color:white;font-size:13px;font-weight:600">Mavi + Nokta</div>
      <div style="color:#64748b;font-size:11px;margin-top:2px">Beyaz W, Emerald Detay</div>
    </div>
  </div>

  <!-- 4: Daire zemin, gölge, W tam ortalı ince -->
  <div onclick="pick('4')" id="v4" style="display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;padding:20px;border-radius:20px;border:2px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);transition:all .25s">
    <svg width="130" height="130" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="a4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
        <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.5"/></filter>
      </defs>
      <circle cx="50" cy="50" r="46" fill="url(#a4)" filter="url(#sh)"/>
      <path d="M15,30 C17,30 21,32 23,38 L30,62 C31,67 33,67 35,62 L42,38 C44,32 46,30 50,30 C54,30 56,32 58,38 L65,62 C67,67 69,67 70,62 L77,38 C79,32 83,30 85,30"
            fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="text-align:center">
      <div style="color:white;font-size:13px;font-weight:600">Daire Gölgeli</div>
      <div style="color:#64748b;font-size:11px;margin-top:2px">Mavi glow efekti</div>
    </div>
  </div>

  <!-- 5: Siyah zemin, W çok ince, emerald renk -->
  <div onclick="pick('5')" id="v5" style="display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;padding:20px;border-radius:20px;border:2px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);transition:all .25s">
    <svg width="130" height="130" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="24" fill="#020817"/>
      <rect x="0" y="0" width="100" height="100" rx="24" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-opacity="0.6"/>
      <path d="M13,28 C15,28 19,30 21,36 L28,62 C29,67 31,67 33,62 L40,38 C42,32 44,30 50,30 C56,30 58,32 60,38 L67,62 C69,67 71,67 72,62 L79,36 C81,30 85,28 87,28"
            fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13,28 C15,28 19,30 21,36 L28,62 C29,67 31,67 33,62 L40,38 C42,32 44,30 50,30 C56,30 58,32 60,38 L67,62 C69,67 71,67 72,62 L79,36 C81,30 85,28 87,28"
            fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.08"/>
    </svg>
    <div style="text-align:center">
      <div style="color:white;font-size:13px;font-weight:600">Siyah + Glow</div>
      <div style="color:#64748b;font-size:11px;margin-top:2px">Emerald neon efekti</div>
    </div>
  </div>

  <!-- 6: Diamond (döndürülmüş kare) içinde W -->
  <div onclick="pick('6')" id="v6" style="display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;padding:20px;border-radius:20px;border:2px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);transition:all .25s">
    <svg width="130" height="130" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="a6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
      </defs>
      <!-- Diamond shape -->
      <rect x="18" y="18" width="64" height="64" rx="14" fill="url(#a6)" transform="rotate(45 50 50)"/>
      <path d="M20,40 C21,40 23,41 24,44 L29,60 C30,63 31,63 33,60 L38,44 C39,41 41,39 50,39 C59,39 61,41 62,44 L67,60 C69,63 70,63 71,60 L76,44 C77,41 79,40 80,40"
            fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="text-align:center">
      <div style="color:white;font-size:13px;font-weight:600">Diamond</div>
      <div style="color:#64748b;font-size:11px;margin-top:2px">Emerald→Mavi, W içinde</div>
    </div>
  </div>

</div>

<div id="result" style="color:#34d399;font-size:17px;font-weight:700;min-height:36px;text-align:center;margin-top:8px"></div>

<script>
var selected = '';
var ids = ['v1','v2','v3','v4','v5','v6'];
function pick(n) {
  selected = n;
  ids.forEach(id => {
    var el = document.getElementById(id);
    if(el){ el.style.borderColor='rgba(255,255,255,0.06)'; el.style.background='rgba(255,255,255,0.03)'; }
  });
  var el = document.getElementById('v'+n);
  if(el){ el.style.borderColor='#34d399'; el.style.background='rgba(52,211,153,0.07)'; }
  document.getElementById('result').textContent = '✅ ' + n + ' seçildi — Cascade\'e bildir!';
}
ids.forEach(id => {
  var el = document.getElementById(id);
  el.onmouseover = function(){ if(selected !== id.replace('v','')) this.style.borderColor='rgba(255,255,255,0.2)'; };
  el.onmouseout  = function(){ if(selected !== id.replace('v','')) this.style.borderColor='rgba(255,255,255,0.06)'; };
});
</script>
</body>
</html>
