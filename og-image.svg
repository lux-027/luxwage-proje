<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="180" fill="white" fill-opacity="0.05"/>
  <circle cx="150" cy="530" r="140" fill="white" fill-opacity="0.05"/>
  <circle cx="1100" cy="550" r="100" fill="white" fill-opacity="0.04"/>

  <!-- Logo card -->
  <rect x="490" y="130" width="100" height="100" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Coin icon (simplified) -->
  <circle cx="540" cy="180" r="30" fill="white" fill-opacity="0.9"/>
  <text x="540" y="189" text-anchor="middle" font-size="28" fill="#2563eb">₺</text>

  <!-- LuxWage title -->
  <text x="600" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="72" fill="white" letter-spacing="-1">LuxWage</text>

  <!-- Subtitle -->
  <text x="600" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="28" fill="white" fill-opacity="0.85">Maaş &amp; Devamsızlık Takip Sistemi</text>

  <!-- Divider -->
  <rect x="460" y="385" width="280" height="2" rx="1" fill="white" fill-opacity="0.3"/>

  <!-- Description -->
  <text x="600" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" fill-opacity="0.75">Çalışanlarınızı kolayca yönetin. Ücretsiz deneyin.</text>

  <!-- URL badge -->
  <rect x="450" y="455" width="300" height="44" rx="22" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
  <text x="600" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="600">luxwage.pro</text>
</svg>
